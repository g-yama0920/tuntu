<style>
/* Layout: header / room stage (flex) / bottom panel with ごはん + おみせ tabs. */
:root {
  --bg: #fdf0d2;
  --fg: #4a3a22;
  --muted: #8f7b55;
  --line: #1c1a17;
  --body: #f7e2ab;
  --body-hi: #fbeec6;
  --body-lo: #f0d598;
  --snot: #c4ecdf;
  --shadow: rgba(60, 40, 10, .22);
  --burst: #d9573a;
  --wall: #f1ebdb;
  --floor: #d8c79e;
  --trim: #c1b08a;
  --glass: #cfe7ef; --glassR: #aebcc7; --glassN: #243058;
  --wp1: #f4dcd2;
  --wp2: #eac6ba;
  --panel: #f7e6c0;
  --card: #fff8e6;
  --coin: #e8a920;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #2a2218; --fg: #f3e3bd; --muted: #a8956f; --shadow: rgba(0,0,0,.4); --burst: #ff8a66;
    --wall: #4a3f2e; --floor: #3a3223; --trim: #5a4d35; --glass: #2a3b4d; --glassR: #36424e; --glassN: #161d38; --wp1: #4a3530; --wp2: #583f38;
    --panel: #342b1d; --card: #40351f; --coin: #f0b93a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #2a2218; --fg: #f3e3bd; --muted: #a8956f; --shadow: rgba(0,0,0,.4); --burst: #ff8a66;
  --wall: #4a3f2e; --floor: #3a3223; --trim: #5a4d35; --glass: #2a3b4d; --glassR: #36424e; --glassN: #161d38; --wp1: #4a3530; --wp2: #583f38;
  --panel: #342b1d; --card: #40351f; --coin: #f0b93a;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); padding-inline: 12px; overflow-x: hidden; }
.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; max-width: 560px; margin-inline: auto; }

header { padding-block: 12px 4px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.35rem; letter-spacing: .03em; white-space: nowrap; }
.right { display: flex; align-items: center; gap: 8px; min-width: 0; }
.coins { display: flex; align-items: center; gap: 6px; background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 6px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.coins svg { width: 22px; height: 22px; flex: none; }
.coins b { font-size: 1.05rem; }
.coins small { font-size: .72rem; color: var(--muted); }
.coins.shake { animation: shake .35s; }
.snd { all: unset; cursor: pointer; font: 700 .78rem var(--font-body); color: var(--muted); padding: 5px 9px; border: 1.5px solid var(--muted); border-radius: 999px; white-space: nowrap; }
.snd[aria-pressed="true"] { color: var(--fg); border-color: var(--fg); }

.stage { position: relative; overflow: hidden; border-radius: 16px; box-sizing: border-box; padding-bottom: 38px; min-height: 0; display: flex; align-items: center; justify-content: center; }
.hit { all: unset; display: block; cursor: pointer; width: 100%; height: 100%; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.hit:focus-visible, .snd:focus-visible, .tab:focus-visible, .food:focus-visible, .buy:focus-visible { outline: 3px solid var(--muted); outline-offset: 3px; }
svg.scene { width: 100%; height: 100%; display: block; overflow: visible; }
.ink { stroke: var(--line); stroke-linecap: round; stroke-linejoin: round; }
.ink:not([fill]) { fill: none; }
.burst-text { font-family: var(--font-display); paint-order: stroke; stroke: var(--bg); stroke-width: 10px; stroke-linejoin: round; text-anchor: middle; }

.say { position: absolute; left: 50%; top: 4%; transform: translateX(-50%); max-width: 88%; background: #fff; color: #1c1a17; border: 2.5px solid var(--line); border-radius: 18px; padding: 8px 14px; font: 700 1.02rem/1.4 var(--font-body); text-align: center; text-wrap: balance; word-break: keep-all; overflow-wrap: anywhere; pointer-events: none; z-index: 3; animation: pop .22s ease-out; }
.say::after { content: ""; position: absolute; left: 50%; bottom: -11px; width: 16px; height: 16px; background: #fff; border-right: 2.5px solid var(--line); border-bottom: 2.5px solid var(--line); transform: translateX(-50%) rotate(45deg); }
.say.angry { background: #ffe3dc; color: #a32a12; font-family: var(--font-display); font-weight: 400; }
.say.angry::after { background: #ffe3dc; }
.pops { position: absolute; inset: 0; pointer-events: none; z-index: 4; overflow: hidden; }
.pop { position: absolute; left: 50%; top: 46%; font: 400 2rem var(--font-display); color: var(--coin); paint-order: stroke; -webkit-text-stroke: 7px var(--bg); transform: translateX(-50%); animation: rise 1.6s ease-out forwards; white-space: nowrap; }
.pop.zero { color: var(--muted); }
@keyframes pop { from { transform: translateX(-50%) scale(.7); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
@keyframes rise { 0% { opacity: 0; margin-top: 30px; } 15% { opacity: 1; } 100% { opacity: 0; margin-top: -90px; } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

.panel { background: var(--panel); border: 2px solid var(--line); border-radius: 20px 20px 0 0; padding: 10px 10px 0; margin-inline: -4px; }
.tabs { display: flex; gap: 4px; margin-bottom: 8px; }
.tab { all: unset; cursor: pointer; flex: 1; white-space: nowrap; font-size: .92rem; text-align: center; padding: 9px 0; border-radius: 12px; font-weight: 700; color: var(--muted); border: 2px solid transparent; }
.tab[aria-selected="true"] { background: var(--card); color: var(--fg); border-color: var(--line); }
.foods { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
.foods::-webkit-scrollbar { display: none; }
.food { all: unset; cursor: pointer; flex: 0 0 auto; width: 84px; display: grid; justify-items: center; gap: 4px; padding: 8px 4px 8px; background: var(--card); border: 2px solid var(--line); border-radius: 14px; font-weight: 700; font-size: .82rem; text-align: center; -webkit-tap-highlight-color: transparent; }
.food svg { width: 52px; height: 52px; }
.fnote { font-weight: 700; font-size: .76rem; color: var(--muted); padding: 0 4px 6px; }
.fnote.full { color: #a32a12; }
.food.bad svg { }
.food:active { transform: translateY(2px); }
.food.lock { opacity: .45; cursor: default; }
.fnote[hidden], .foods[hidden], .shop[hidden], .zukan[hidden], .say[hidden] { display: none; }
.shop { max-height: 150px; overflow-y: auto; display: grid; gap: 6px; padding-bottom: 12px; }
.row { display: flex; align-items: center; gap: 10px; background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 6px 8px 6px 12px; min-width: 0; }
.row .nm { flex: 1; font-weight: 700; min-width: 0; }
.buy { all: unset; cursor: pointer; min-width: 84px; text-align: center; padding: 8px 10px; background: var(--coin); color: #1c1a17; border: 2px solid var(--line); border-radius: 10px; font-weight: 700; font-size: .85rem; font-variant-numeric: tabular-nums; }
.buy.poor { background: transparent; color: var(--muted); border-color: var(--muted); }
.buy.own { background: transparent; color: var(--fg); border-style: dashed; cursor: default; }
.foot { padding-block: 0 calc(8px + env(safe-area-inset-bottom, 0px)); }

.hud { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; pointer-events: none; z-index: 3; }
.hud > * { pointer-events: auto; }
.streak { background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 4px 10px; font-weight: 700; font-size: .74rem; white-space: nowrap; color: var(--fg); }
.streak .dots { letter-spacing: .12em; color: var(--coin); }
.streak.done { background: var(--coin); color: #1c1a17; }
.talk { all: unset; pointer-events: auto; cursor: pointer; background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 4px 10px; font: 700 .74rem var(--font-body); color: var(--fg); white-space: nowrap; }
.hudr { display: flex; gap: 4px; align-items: flex-end; flex: none; }
.hud .streak { min-width: 0; overflow: hidden; text-overflow: ellipsis; padding: 4px 8px; font-size: .68rem; }
.hud .shoot, .hud .talk { padding: 4px 8px; font-size: .7rem; }
.shoot { all: unset; pointer-events: auto; cursor: pointer; background: var(--coin); border: 2px solid var(--line); border-radius: 999px; padding: 4px 10px; font: 700 .74rem var(--font-body); color: #1c1a17; white-space: nowrap; }
.shoot:focus-visible { outline: 3px solid var(--muted); outline-offset: 3px; }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 8; }
.flash.on { animation: flashA .35s ease-out; }
@keyframes flashA { 0% { opacity: .9; } 100% { opacity: 0; } }
.album { max-height: 150px; overflow-y: auto; padding-bottom: 12px; }
.album[hidden] { display: none; }
.alh { font-weight: 700; font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
.alg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.alg button { all: unset; cursor: pointer; display: block; border: 2px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--card); }
.alg img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; }
.alg button:focus-visible { outline: 3px solid var(--muted); outline-offset: 2px; }
.alempty { font-size: .85rem; color: var(--muted); text-align: center; padding: 10px 0; line-height: 1.6; }
.game { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; max-width: 560px; margin-inline: auto; background: var(--panel); color: var(--fg); border: 2.5px solid var(--line); border-bottom: 0; border-radius: 20px 20px 0 0; padding: 12px 14px calc(14px + env(safe-area-inset-bottom)); box-shadow: 0 -6px 22px rgba(0,0,0,.22); text-align: center; }
.game[hidden] { display: none; }
.game .gt { font-weight: 800; font-size: 1rem; margin-bottom: 2px; }
.game .gs { font-size: .85rem; color: var(--muted); min-height: 1.3em; margin-bottom: 4px; }
.game .gm { font-size: 2.2rem; line-height: 1.25; margin: 4px 0; letter-spacing: .12em; }
.game .gm small { display: block; font-size: .9rem; letter-spacing: 0; font-weight: 700; }
.game .gr { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
.game button { all: unset; cursor: pointer; box-sizing: border-box; background: var(--coin); color: #1c1a17; border: 2px solid var(--line); border-radius: 12px; padding: 9px 16px; font-weight: 800; font-size: 1rem; min-width: 64px; text-align: center; }
.game button.sub { background: var(--card); color: var(--fg); }
.game button.hand { font-size: 2rem; padding: 8px 14px; line-height: 1.1; }
.game button.big { width: 100%; padding: 26px 10px; font-size: 1.4rem; background: #d9d2c0; }
.game button.big.go { background: #7fcf6a; }
.game .cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 6px; }
.game .card { aspect-ratio: 1; padding: 0; min-width: 0; border-radius: 10px; background: #f4c85a; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; }
.game .card.up, .game .card.ok { background: #fff; }
.game .card.ok { opacity: .45; }
.game .card svg { width: 80%; height: 80%; }
.game .cups { position: relative; height: 104px; margin: 36px 0 4px; }
.game .cup { position: absolute; top: 0; width: 28%; height: 100%; transition: left .24s ease; padding: 0; background: none; border: 0; border-radius: 0; min-width: 0; }
.game .cup .ball { position: absolute; left: 50%; bottom: 6px; width: 46px; height: 46px; margin-left: -23px; }
.game .cup .ball svg { width: 100%; height: 100%; }
.game .cup .lid { position: absolute; left: 4%; right: 4%; bottom: 0; height: 74px; background: #f4c85a; border: 2.5px solid var(--line); border-radius: 8px 8px 22px 22px; transition: transform .25s ease; }
.game .cup.up .lid { transform: translateY(-58px); }
.game .bar { position: relative; height: 26px; margin: 10px 4px 4px; border: 2.5px solid var(--line); border-radius: 13px; background: #fff; overflow: hidden; }
.game .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #a9dcc8; }
.game .bar b { position: absolute; top: -2px; bottom: -2px; width: 4px; background: #d9573a; }
.game .holes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 6px 0; }
.game .hole { padding: 0; min-width: 0; height: 52px; font-size: 1.8rem; background: #cdb98a; border-radius: 26px; display: flex; align-items: center; justify-content: center; }
.game .lanes { display: flex; gap: 8px; margin: 6px 0; }
.game .lane { flex: 1; position: relative; height: 128px; border: 2.5px solid var(--line); border-radius: 12px; background: #fff; overflow: hidden; }
.game .lane .who { position: absolute; top: 4px; left: 8px; font-size: .75rem; font-weight: 800; color: var(--muted); }
.game .lane .pc { position: absolute; left: 50%; bottom: 6px; width: 40px; margin-left: -20px; height: 40px; font-size: 1.7rem; text-align: center; line-height: 40px; transition: transform .12s ease-out; }
.game .lane .pc.up { transform: translateY(-54px); }
.game .lane .tb { display: block; width: 38px; height: 40px; margin: 0 auto; border-radius: 50% 50% 45% 45%; background: #f7e2ab; border: 2.5px solid var(--line); font-size: 1rem; line-height: 36px; }
.game .lane .drop { position: absolute; left: 50%; margin-left: -10px; top: -26px; font-size: 1.3rem; }
.game .lane.hit { background: #ffe3dc; }
.game .pair { display: flex; gap: 10px; justify-content: center; margin: 8px 0; }
.game .pair button { flex: 1; max-width: 160px; background: #fff; flex-direction: column; display: flex; align-items: center; gap: 4px; padding: 10px 8px; }
.game .pair button svg { width: 62px; height: 62px; }
.game .bingo { display: flex; gap: 12px; justify-content: center; align-items: flex-start; margin-top: 4px; }
.game .bingo .cards { grid-template-columns: repeat(3, 1fr); gap: 5px; width: 52%; margin-top: 0; }
.game .bingo .card { font-size: 1.2rem; font-weight: 800; aspect-ratio: 1.2; }
.game .bingo .card.mk { background: #9bdcb4; }
.game .bingo .tcard { width: 34%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; font-size: .72rem; }
.game .bingo .tcard span { border: 1.5px solid var(--line); border-radius: 5px; padding: 3px 0; background: #f4c85a; }
.game .bingo .tcard span.mk { background: #9bdcb4; }
.game .track { display: grid; grid-template-columns: repeat(11, 1fr); gap: 2px; margin: 3px 0; font-size: .72rem; }
.game .track span { height: 30px; border: 1.5px solid var(--line); border-radius: 6px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: .95rem; line-height: 1; }
.game .track span small { font-size: .55rem; display: block; }
.game .track span.sp { background: #ffe9a8; }
.game .track span.go { background: #9bdcb4; }
.game .row2 { font-size: .8rem; font-weight: 800; text-align: left; margin-top: 4px; }
.game .colors { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 8px 0; }
.game .colors button { aspect-ratio: 1.3; padding: 0; border-radius: 14px; opacity: .55; transition: opacity .1s, transform .1s; }
.game .colors button.lit { opacity: 1; transform: scale(1.06); box-shadow: 0 0 14px 4px rgba(255,255,255,.9); }
.game .rail { position: relative; height: 70px; border: 2.5px solid var(--line); border-radius: 12px; background: #fff; overflow: hidden; margin: 6px 0; }
.game .rail .tg { position: absolute; top: 14px; width: 44px; height: 44px; margin-left: -22px; border-radius: 50% 50% 45% 45%; background: #f7e2ab; border: 2.5px solid var(--line); text-align: center; line-height: 40px; font-size: 1.1rem; }
.game .rail .tg.hit { background: #ffb4a0; }
.game .nums { display: flex; gap: 8px; justify-content: center; margin: 6px 0; }
.game .nums button { flex: 1; max-width: 80px; font-size: 1.8rem; padding: 12px 0; background: #fff; }
.game .nums button.back { background: #f4c85a; color: transparent; }
.viewer { position: fixed; inset: 0; z-index: 50; background: rgba(20,14,6,.85); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; }
.viewer[hidden] { display: none; }
.viewer img { max-width: 100%; max-height: 68vh; border: 3px solid var(--line); border-radius: 10px; background: #fff; }
.viewer .vd { color: #fff; font-weight: 700; font-size: .85rem; }
.viewer .vb { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.viewer .vb button { all: unset; cursor: pointer; background: var(--coin); color: #1c1a17; border: 2px solid var(--line); border-radius: 10px; padding: 7px 14px; font-weight: 700; font-size: .88rem; }
.viewer .vb button.sub { background: var(--card); }
.talk:focus-visible { outline: 3px solid var(--muted); outline-offset: 3px; }
.flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flick .5s ease-in-out infinite alternate; }
@keyframes flick { from { transform: scale(1, 1) rotate(-4deg); } to { transform: scale(.85, 1.2) rotate(4deg); } }
.itm { cursor: pointer; }
.itm.sel { filter: drop-shadow(0 0 7px #f2b92e) drop-shadow(0 0 3px #f2b92e); }
.mvbar { position: absolute; left: 8px; right: 8px; bottom: 44px; z-index: 5; display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--card); border: 2.5px solid var(--line); border-radius: 14px; padding: 6px 10px; font-weight: 700; font-size: .8rem; }
.mvbar button, .dlg button { all: unset; white-space: nowrap; cursor: pointer; background: var(--coin); color: #1c1a17; border: 2px solid var(--line); border-radius: 10px; padding: 5px 12px; font-weight: 700; font-size: .85rem; }
.dlg { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 6; background: var(--card); border: 3px solid var(--line); border-radius: 16px; padding: 14px 16px; text-align: center; font-weight: 700; display: grid; gap: 10px; min-width: 200px; }
.dlg div { display: flex; gap: 10px; justify-content: center; }
.dlg #dlgNo { background: transparent; color: var(--fg); }
.mvbar[hidden], .dlg[hidden] { display: none; }
.sec.ltd { color: #a32a12; font-size: .95rem; font-family: var(--font-display); font-weight: 400; }
.sec.hintrow { font-weight: 500; }
.sec { font-weight: 700; font-size: .78rem; color: var(--muted); padding: 4px 2px 0; }
.tag { font-style: normal; font-size: .68rem; background: var(--coin); color: #1c1a17; border-radius: 6px; padding: 1px 6px; margin-left: 4px; white-space: nowrap; }
.zukan { max-height: 150px; overflow-y: auto; display: grid; gap: 6px; padding-bottom: 12px; align-content: start; }
.zg { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.zc { background: var(--card); border: 2px solid var(--line); border-radius: 10px; padding: 5px 2px; text-align: center; font-size: .66rem; font-weight: 700; display: grid; justify-items: center; gap: 2px; min-width: 0; }
.zc svg { width: 34px; height: 34px; }
.zc.unk { color: var(--muted); }
.zc.unk svg { filter: grayscale(1) brightness(.35); opacity: .5; }
.zl { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: .72rem; font-weight: 700; }
.chip.unk { border-style: dashed; border-color: var(--muted); color: var(--muted); }
.rain { stroke: #eaf4fb; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 10 30; opacity: .85; animation: rainf .7s linear infinite; }
@keyframes rainf { to { stroke-dashoffset: -40; } }
.sway { transform-box: fill-box; transform-origin: 50% 0; animation: sway 3.2s ease-in-out infinite; }
@keyframes sway { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
@media (prefers-reduced-motion: reduce) { .pop { animation-duration: 2.4s; } .rain, .sway { animation: none; } }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>つんつ君</h1>
    <div class="right">
      <button class="snd" id="snd" type="button" aria-pressed="true">音 ON</button>
      <div class="coins" id="coinsBox" aria-live="polite">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#f2b92e" stroke="#1c1a17" stroke-width="2"/><circle cx="12" cy="12" r="6" fill="none" stroke="#b5760f" stroke-width="2"/><path d="M9.5 12h5M12 9.5v5" stroke="#b5760f" stroke-width="1.8" stroke-linecap="round"/></svg>
        <b id="coins">0</b><small>つんつ</small>
      </div>

    function sum(a) { return a.reduce(function (x, y) { return x + y; }, 0); }
    function draw() {
      gHtml(GAME_NAME.big, "3まいの合計が 大きいほうが勝ち", "", '<div class="gs">グミのカード' + (swapped ? "" : "（1まいだけ 引きなおせる）") + ' 合計 ' + sum(me) + '</div><div class="nums">' + me.map(function (n, i) { return '<button type="button" data-g="' + i + '">' + n + '</button>'; }).join("") + '</div><div class="gs">つんつのカード</div><div class="nums">' + him.map(function () { return '<button type="button" class="back">？</button>'; }).join("") + '</div><div class="gr">' + gBtn("ok", "これで勝負！") + '</div>');
      gOn(function (v) {
        if (v === "ok") return reveal();
        if (swapped) return; swapped = true; me[+v] = randInt(1, 9); sndPop(); draw();
      });
    }
    function reveal() {
      if (sum(him) <= 13) { var lo = him.indexOf(Math.min.apply(null, him)); him[lo] = randInt(1, 9); }
      var a = sum(me), b = sum(him);
      gHtml(GAME_NAME.big, a === b ? "同点！ もう一回" : a > b ? "グミの勝ち！" : "つんつの勝ち！", "グミ " + a + "<small>vs</small>つんつ " + b, '<div class="nums">' + him.map(function (n) { return '<button type="button">' + n + '</button>'; }).join("") + '</div>');
      sndPop();
      gT(function () { if (a === b) { me = [0, 0, 0].map(function () { return randInt(1, 9); }); him = [0, 0, 0].map(function () { return randInt(1, 9); }); swapped = false; draw(); } else gFinish("big", a > b, 20); }, 1700);
    }
    draw();
  }
  if (gPractice) {
    var pm = document.createElement("div");
    pm.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:50;background:#fff8e6;border-bottom:2px solid #1c1a17;padding:6px;display:flex;flex-wrap:wrap;gap:4px;font:700 .72rem sans-serif";
    pm.innerHTML = '<span style="width:100%">れんしゅう（つんつは もらえない）</span>';
    Object.keys(GAME_NAME).forEach(function (k) {
      var b = document.createElement("button"); b.type = "button"; b.textContent = GAME_NAME[k];
      b.style.cssText = "padding:4px 8px;border:1.5px solid #1c1a17;border-radius:999px;background:#fff;font:inherit";
      b.addEventListener("click", function () { if (gameOn) gClose(); startGame(k); });
      pm.appendChild(b);
    });
    document.body.appendChild(pm);
  }
  function startGame(kind) {
    gameOn = true; gameEl.hidden = false;
    if (kind === "jk") jankenPlay("jk", "", function (win) { gFinish("jk", win, 10); });
    else if (kind === "dir") dirPlay("まず じゃんけん");
    else if (kind === "fast") fastPlay();
    else if (kind === "baba") babaPlay();
    else if (kind === "cups") cupsPlay();
    else if (kind === "nose") nosePlay();
    else if (kind === "mole") molePlay();
    else if (kind === "jump") jumpPlay();
    else if (kind === "weigh") weighPlay();
    else if (kind === "bingo") bingoPlay();
    else if (kind === "sugo") sugoPlay();
    else if (kind === "simon") simonPlay();
    else if (kind === "stopw") stopwPlay();
    else if (kind === "ball") ballPlay();
    else if (kind === "big") bigPlay();
    else memPlay();
  }
  function invite(kind) {
    gameOn = true; gameEl.hidden = false;
    say("グミ、つんつと" + GAME_NAME[kind] + "しないか？", 9000);
    var rw = kind === "jk" ? 10 : 20;
    gHtml("つんつ君から しょうぶ！", GAME_NAME[kind] + "：勝つと " + rw + "つんつ", "", '<div class="gr">' + gBtn("yes", "あそぶ") + gBtn("no", "あとで", "sub") + '</div>');
    gOn(function (v) {
      var t = todayIdx(), lk = kind === "jk" ? "jk" : "gm";
      if (v === "yes") { SV[lk + "Day"] = t; save(); gameEl.hidden = false; startGame(kind); }
      else { SV[lk + "Later"] = Date.now() + 3600000; SV[lk + "LaterDay"] = t; save(); say("むぅ、じゃあ あとでな。また誘うぞ", 2800); gClose(); }
    });
  }
  setInterval(function () {
    if (gameOn || !isBase(mode) || mode === "sleep" || mode === "read" || STATES[mode].short || STATES[mode].angry || !sayEl.hidden) return;
    var now = performance.now(); if (now < 25000 || now - gameLast < 180000) return;
    var t = todayIdx();
    var wait = function (k) { return SV[k + "LaterDay"] === t && Date.now() < (SV[k + "Later"] || 0); };
    if (SV.jkDay !== t && !wait("jk")) { invite("jk"); return; }
    if (SV.gmDay !== t && !wait("gm")) {
      if (SV.gmKindDay !== t) { SV.gmKind = ["mem", "dir", "fast", "baba", "cups", "nose", "mole", "jump", "weigh", "bingo", "sugo", "simon", "stopw", "ball", "big"][randInt(0, 14)]; SV.gmKindDay = t; save(); }
      invite(SV.gmKind);
    }
  }, 7000);

  function tokyoTick() {
    var d = new Date(), h = d.getHours() + d.getMinutes() / 60, t = todayIdx();
    if (gameOn || h < 19 || h >= 19.5 || SV.tokyo === t || !isBase(mode) || performance.now() < 4500) return;
    SV.tokyo = t; save();
    var now = performance.now(); enterState("sing", now); nextChange = now + 24000;
    say("東京は夜の7時〜♪", 4200);
    setTimeout(function () { if (mode === "sing") say("東京は夜の7時〜♪", 4200); }, 9000);
    setTimeout(function () { if (mode === "sing") say("東京は夜の7時〜♪♪", 4200); }, 17000);
  }
  setTimeout(tokyoTick, 5000);
  setInterval(function () {
    tokyoTick();
    if (setliOk() && isBase(mode) && performance.now() > 3000) { SV.setli = 1; save(); say(SETLI, 4200); nextTalk = performance.now() + 20000; }
  }, 15000);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && setliOk() && isBase(mode)) { SV.setli = 1; save(); say(SETLI, 4200); nextTalk = performance.now() + 20000; }
  });
  applyEnv(); envAt = performance.now() + 15000;
  refreshPanels();
  requestAnimationFrame(frame);
})();
</script>
